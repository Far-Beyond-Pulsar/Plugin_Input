[package]
name = "input_plugin"
version = "0.1.0"
edition = "2021"
description = "Input action and input mapping assets, their editors, and the input runtime that publishes actions on the Gamma event bus"

[lib]
crate-type = ["cdylib", "rlib"]
name = "input_plugin"

[features]
# Statically linked hosts use the Rust API and must not emit the
# process-global dynamic loader symbols shared by every plugin.
builtin = []
# Poll game controllers (gilrs) from the runtime.
gamepad = ["dep:gilrs"]
# The editors, the file types and the `EditorPlugin` itself (GPUI). A game
# links the crate without it: only `keys`, `model`, `library`, `runtime` and
# `preview` are built, and they know nothing about GPUI.
editor = ["dep:gpui-ce", "dep:ui", "dep:plugin_editor_api", "pulsar_reflection/prims-gpui"]
default = ["gamepad", "editor"]

[dependencies]
# The plugin's descriptor and its editor provider's registration.
pulsar_plugins = { workspace = true }
plugin_manager = { workspace = true }
gpui-ce = { workspace = true, optional = true }
ui = { workspace = true, optional = true }
plugin_editor_api = { workspace = true, optional = true }
engine_class_derive = { workspace = true }
pulsar_reflection = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_world_registry = { workspace = true }
pulsar_events = { workspace = true }
profiling = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
gilrs = { version = "0.11.2", optional = true }

[dev-dependencies]
# Headless rendering of the editors (`gpui::TestAppContext`, `#[gpui::test]`).
gpui-ce = { workspace = true, features = ["test-support"] }
