# The `pulsar.input` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its editors and file types are
# absent (see crates/core/pulsar_plugins). Its root crate carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.input"
name = "Input"
description = "Input actions and mappings, their editors, and the runtime that publishes their events"
enabled_by_default = true
provides = [
    { id = "pulsar.input.classes", kind = "class", members = ["PlayerInputComponent"], version = 1 },
]
requires = []

# The plugin's root crate (the package in this directory): the one place it
# registers everything it contributes. A game links it without its `editor`
# feature; the editor links it with.
root = "input_plugin"
